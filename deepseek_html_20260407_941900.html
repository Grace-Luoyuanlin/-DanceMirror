<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>镜舞·专业扒舞器 | 循环/调速/镜像/音量/旋转/缩放</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0B1120 0%, #111827 100%);
            font-family: 'Inter', system-ui, sans-serif;
            min-height: 100vh;
            padding: 1.5rem;
            color: #F3F4F6;
        }

        .glass-panel {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(17, 24, 39, 0.65);
            backdrop-filter: blur(18px);
            border-radius: 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .hero {
            padding: 1.8rem 2rem 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .hero h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(120deg, #FFE6B0, #FFB347);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .hero p {
            color: #9CA3AF;
            margin-top: 0.4rem;
        }

        .two-columns {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 1.8rem;
            padding: 1.8rem;
        }

        .control-card {
            background: rgba(0, 0, 0, 0.45);
            border-radius: 1.8rem;
            padding: 1.5rem;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 200, 100, 0.2);
        }

        .upload-area {
            background: rgba(255, 240, 200, 0.03);
            border-radius: 1.2rem;
            padding: 1.2rem;
            text-align: center;
            border: 1px dashed #FFB347;
            margin-bottom: 1.5rem;
        }

        .file-label {
            background: linear-gradient(105deg, #FF8C42, #FF5E7E);
            display: inline-block;
            padding: 10px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #0A0F1E;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
            transition: 0.2s;
        }

        .file-label:hover {
            transform: scale(1.02);
            filter: brightness(1.05);
        }

        input[type="file"] {
            display: none;
        }

        .video-name {
            font-size: 0.8rem;
            color: #FCD34D;
            margin-top: 12px;
            word-break: break-all;
        }

        /* 公用滑块样式 */
        .slider-block {
            background: rgba(0, 0, 0, 0.35);
            border-radius: 1.2rem;
            padding: 1rem;
            margin: 1rem 0;
        }

        .slider-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 0.8rem;
        }

        input[type="range"] {
            flex: 2;
            height: 5px;
            border-radius: 10px;
            background: #FFB347;
            -webkit-appearance: none;
        }

        input[type="range"]:focus {
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            background: #FFE484;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 6px #FFB347;
        }

        .value-label {
            background: #1E293B;
            padding: 4px 14px;
            border-radius: 40px;
            font-family: monospace;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 0.8rem;
            flex-wrap: wrap;
        }

        .btn {
            background: rgba(30, 41, 59, 0.8);
            border: none;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            backdrop-filter: blur(4px);
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: linear-gradient(95deg, #FF7B2C, #FF3A5E);
            box-shadow: 0 4px 12px rgba(255, 50, 80, 0.3);
        }

        .btn-primary:hover,
        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        /* 循环区域 */
        .loop-section {
            background: #0F172A;
            border-radius: 1.2rem;
            padding: 1rem;
            margin: 1rem 0;
        }

        .loop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .loop-badge {
            font-weight: 600;
            color: #FFB347;
        }

        .loop-time {
            background: #00000066;
            padding: 6px 12px;
            border-radius: 40px;
            font-family: monospace;
            font-size: 0.8rem;
        }

        .loop-buttons {
            display: flex;
            gap: 10px;
            margin: 12px 0;
        }

        .toggle-loop {
            background: #334155;
            transition: 0.2s;
        }

        .toggle-loop.active {
            background: #FF8C42;
            color: #0A0F1E;
        }

        /* 视频区域 */
        .video-stage {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 1.8rem;
            padding: 0.8rem;
        }

        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 1.4rem;
            overflow: hidden;
            box-shadow: 0 20px 30px -10px black;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 280px;
        }

        video {
            max-width: 100%;
            max-height: 60vh;
            display: block;
            background: #0F0F0F;
            border-radius: 1rem;
            transition: transform 0.1s ease;
        }

        /* 自定义进度条 */
        .custom-progress {
            margin: 12px 8px 8px 8px;
            position: relative;
            height: 30px;
            display: flex;
            align-items: center;
        }

        .progress-track {
            flex: 1;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            position: relative;
            cursor: pointer;
        }

        .progress-fill {
            height: 100%;
            background: #FF8C42;
            border-radius: 4px;
            width: 0%;
            position: relative;
            z-index: 2;
        }

        .progress-thumb {
            width: 14px;
            height: 14px;
            background: white;
            border-radius: 50%;
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            left: 0%;
            z-index: 3;
            box-shadow: 0 0 6px rgba(0,0,0,0.5);
            cursor: pointer;
        }

        .loop-marker {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            z-index: 4;
            pointer-events: none;
        }
        .loop-marker-start {
            background: #22C55E;
            box-shadow: 0 0 0 2px #0F172A;
        }
        .loop-marker-end {
            background: #EF4444;
            box-shadow: 0 0 0 2px #0F172A;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #9CA3AF;
            margin-top: 6px;
            padding: 0 8px;
        }

        .control-row {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 1rem;
        }

        .status-badge {
            background: #00000066;
            border-radius: 40px;
            padding: 6px 14px;
            font-size: 0.7rem;
            text-align: center;
            margin-top: 1rem;
            color: #B9C7D9;
        }

        @media (max-width: 860px) {
            .two-columns {
                grid-template-columns: 1fr;
                gap: 1rem;
                padding: 1rem;
            }
            .hero {
                padding: 1.2rem;
            }
        }

        footer {
            text-align: center;
            padding: 1.2rem;
            font-size: 0.7rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #6B7280;
        }
    </style>
</head>
<body>
<div class="glass-panel">
    <div class="hero">
        <h1>🎬 镜舞 · 专业扒舞器</h1>
        <p>上传视频 → 自由标记循环区间 | 调速/镜像/音量/旋转/缩放 | 进度条可见绿红点</p>
    </div>
    <div class="two-columns">
        <!-- 左侧控制区 -->
        <div class="control-card">
            <div class="upload-area">
                <label class="file-label">
                    📂 上传舞蹈视频 (MP4/MOV/WebM)
                    <input type="file" id="videoUpload" accept="video/*">
                </label>
                <div id="fileNameDisplay" class="video-name">✨ 未选择视频</div>
            </div>

            <!-- 速度 & 镜像 -->
            <div class="slider-block">
                <div class="slider-row">
                    <span>⏩ 播放速度</span>
                    <input type="range" id="speedSlider" min="0.1" max="2.0" step="0.01" value="1.0">
                    <span class="value-label" id="speedLabel">1.00x</span>
                </div>
                <div class="btn-group">
                    <button id="mirrorBtn" class="btn">🪞 镜像翻转</button>
                    <button id="resetMirrorBtn" class="btn">🔄 重置镜像</button>
                </div>
            </div>

            <!-- 新增：音量 + 旋转 + 缩放 -->
            <div class="slider-block">
                <div class="slider-row">
                    <span>🔊 音量</span>
                    <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1.0">
                    <span class="value-label" id="volumeLabel">100%</span>
                </div>
                <div class="btn-group">
                    <button id="rotateLeftBtn" class="btn">🔄 逆时针90°</button>
                    <button id="rotateRightBtn" class="btn">🔁 顺时针90°</button>
                    <button id="resetRotateBtn" class="btn">⟳ 重置方向</button>
                </div>
                <div class="slider-row">
                    <span>🔍 画面大小</span>
                    <input type="range" id="scaleSlider" min="0.5" max="2.0" step="0.01" value="1.0">
                    <span class="value-label" id="scaleLabel">100%</span>
                </div>
            </div>

            <!-- 循环控制区 -->
            <div class="loop-section">
                <div class="loop-header">
                    <span class="loop-badge">🔁 片段循环练习</span>
                    <span id="loopStatus" class="loop-time">未设置循环</span>
                </div>
                <div class="loop-buttons">
                    <button id="setStartBtn" class="btn">📍 标记起点</button>
                    <button id="setEndBtn" class="btn">🏁 标记终点</button>
                    <button id="clearLoopBtn" class="btn">🗑️ 清除循环</button>
                </div>
                <button id="toggleLoopBtn" class="btn toggle-loop" style="width: 100%; justify-content: center;">⏸ 循环未启用</button>
                <div class="status-badge" style="margin-top: 10px;">
                    💡 提示：播放到想循环的开始/结束位置 → 点击标记起点/终点(绿/红点)。启用循环后自动重复该区间。
                </div>
            </div>
        </div>

        <!-- 右侧视频区 -->
        <div class="video-stage">
            <div class="video-wrapper" id="videoWrapper">
                <video id="danceVideo" playsinline></video>
            </div>
            <!-- 自定义进度条 -->
            <div class="custom-progress" id="progressContainer">
                <div class="progress-track" id="progressTrack">
                    <div class="progress-fill" id="progressFill"></div>
                    <div class="progress-thumb" id="progressThumb"></div>
                    <div id="loopMarkerStart" class="loop-marker loop-marker-start" style="display: none;"></div>
                    <div id="loopMarkerEnd" class="loop-marker loop-marker-end" style="display: none;"></div>
                </div>
            </div>
            <div class="time-display">
                <span id="currentTimeLabel">0:00</span>
                <span id="durationLabel">0:00</span>
            </div>
            <div class="control-row">
                <button id="playBtn" class="btn btn-primary">▶ 播放 / 暂停</button>
                <button id="restartBtn" class="btn">🔄 重头播放</button>
            </div>
            <div class="status-badge">
                ✨ 旋转、缩放、镜像可同时叠加，进度条上的绿/红点为循环区间。点击进度条任意位置可跳转。
            </div>
        </div>
    </div>
    <footer>🎯 全功能扒舞工具：精准循环 | 速度0.1~2.0 | 音量独立 | 画面旋转/缩放 | 镜像辅助</footer>
</div>

<script>
    (function() {
        // DOM 元素
        const videoUpload = document.getElementById('videoUpload');
        const danceVideo = document.getElementById('danceVideo');
        const fileNameSpan = document.getElementById('fileNameDisplay');
        const speedSlider = document.getElementById('speedSlider');
        const speedLabel = document.getElementById('speedLabel');
        const volumeSlider = document.getElementById('volumeSlider');
        const volumeLabel = document.getElementById('volumeLabel');
        const scaleSlider = document.getElementById('scaleSlider');
        const scaleLabel = document.getElementById('scaleLabel');
        const rotateLeftBtn = document.getElementById('rotateLeftBtn');
        const rotateRightBtn = document.getElementById('rotateRightBtn');
        const resetRotateBtn = document.getElementById('resetRotateBtn');
        const mirrorBtn = document.getElementById('mirrorBtn');
        const resetMirrorBtn = document.getElementById('resetMirrorBtn');
        const playBtn = document.getElementById('playBtn');
        const restartBtn = document.getElementById('restartBtn');
        const setStartBtn = document.getElementById('setStartBtn');
        const setEndBtn = document.getElementById('setEndBtn');
        const clearLoopBtn = document.getElementById('clearLoopBtn');
        const toggleLoopBtn = document.getElementById('toggleLoopBtn');
        const loopStatusSpan = document.getElementById('loopStatus');

        // 进度条元素
        const progressTrack = document.getElementById('progressTrack');
        const progressFill = document.getElementById('progressFill');
        const progressThumb = document.getElementById('progressThumb');
        const currentTimeLabel = document.getElementById('currentTimeLabel');
        const durationLabel = document.getElementById('durationLabel');
        const loopMarkerStart = document.getElementById('loopMarkerStart');
        const loopMarkerEnd = document.getElementById('loopMarkerEnd');

        // 状态变量
        let currentVideoURL = null;
        let loopStart = null;
        let loopEnd = null;
        let loopEnabled = false;
        let isDragging = false;
        
        // 画面变换状态
        let currentRotate = 0;      // 0, 90, 180, 270
        let currentScale = 1.0;      // 缩放倍数
        let isMirrored = false;       // 镜像标志

        // ---------- 画面变换合成 ----------
        function updateVideoTransform() {
            let transform = '';
            // 注意顺序：先缩放，再旋转，再镜像（或者任意顺序，但为直观）
            // 使用 matrix 太复杂，分别应用 transform 属性会互相覆盖，所以合成一个字符串
            // 例如：scale(1.5) rotate(90deg) scaleX(-1)
            transform += `scale(${currentScale}) `;
            transform += `rotate(${currentRotate}deg) `;
            if (isMirrored) {
                transform += `scaleX(-1) `;
            }
            danceVideo.style.transform = transform.trim();
        }

        // 缩放同步
        function updateScale() {
            const val = parseFloat(scaleSlider.value);
            scaleLabel.innerText = `${Math.round(val * 100)}%`;
            currentScale = val;
            updateVideoTransform();
        }

        // 旋转控制
        function rotateLeft() {
            currentRotate = (currentRotate - 90 + 360) % 360;
            updateVideoTransform();
        }
        function rotateRight() {
            currentRotate = (currentRotate + 90) % 360;
            updateVideoTransform();
        }
        function resetRotate() {
            currentRotate = 0;
            updateVideoTransform();
        }

        // 镜像
        function setMirror(enable) {
            isMirrored = enable;
            updateVideoTransform();
        }

        // ---------- 音量控制 ----------
        function updateVolume() {
            const val = parseFloat(volumeSlider.value);
            volumeLabel.innerText = `${Math.round(val * 100)}%`;
            danceVideo.volume = val;
        }

        // ---------- 速度控制 ----------
        function updateSpeed() {
            const val = parseFloat(speedSlider.value);
            speedLabel.innerText = val.toFixed(2) + 'x';
            danceVideo.playbackRate = val;
        }

        // ---------- 循环相关逻辑 (与之前一致) ----------
        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs.toString().padStart(2, '0')}`;
        }

        function updateProgressUI() {
            if (!danceVideo.duration || isNaN(danceVideo.duration)) return;
            const percent = (danceVideo.currentTime / danceVideo.duration) * 100;
            progressFill.style.width = `${percent}%`;
            progressThumb.style.left = `${percent}%`;
            currentTimeLabel.innerText = formatTime(danceVideo.currentTime);
            durationLabel.innerText = formatTime(danceVideo.duration);
        }

        function updateLoopMarkers() {
            if (!danceVideo.duration || isNaN(danceVideo.duration)) {
                loopMarkerStart.style.display = 'none';
                loopMarkerEnd.style.display = 'none';
                return;
            }
            if (loopStart !== null && loopStart >= 0) {
                const percent = (loopStart / danceVideo.duration) * 100;
                loopMarkerStart.style.left = `${percent}%`;
                loopMarkerStart.style.display = 'block';
            } else {
                loopMarkerStart.style.display = 'none';
            }
            if (loopEnd !== null && loopEnd <= danceVideo.duration) {
                const percent = (loopEnd / danceVideo.duration) * 100;
                loopMarkerEnd.style.left = `${percent}%`;
                loopMarkerEnd.style.display = 'block';
            } else {
                loopMarkerEnd.style.display = 'none';
            }
        }

        function updateLoopStatusDisplay() {
            if (loopStart !== null && loopEnd !== null) {
                loopStatusSpan.innerHTML = `🔁 ${formatTime(loopStart)} → ${formatTime(loopEnd)}`;
                loopStatusSpan.style.color = '#FFB347';
            } else if (loopStart !== null) {
                loopStatusSpan.innerHTML = `📍 起点: ${formatTime(loopStart)} , 等待标记终点`;
                loopStatusSpan.style.color = '#FCD34D';
            } else if (loopEnd !== null) {
                loopStatusSpan.innerHTML = `🏁 终点: ${formatTime(loopEnd)} , 等待标记起点`;
                loopStatusSpan.style.color = '#FCD34D';
            } else {
                loopStatusSpan.innerHTML = `未设置循环`;
                loopStatusSpan.style.color = '#9CA3AF';
            }
            updateLoopMarkers();
        }

        function setLoopStart() {
            if (!danceVideo.src || danceVideo.src === '') {
                alert('请先上传视频');
                return;
            }
            const currentTime = danceVideo.currentTime;
            loopStart = currentTime;
            if (loopEnd !== null && loopStart >= loopEnd) {
                alert('起点不能大于等于终点，已自动交换');
                [loopStart, loopEnd] = [loopEnd, loopStart];
            }
            updateLoopStatusDisplay();
            if (loopEnabled && loopStart !== null && loopEnd !== null) {
                if (danceVideo.currentTime < loopStart || danceVideo.currentTime > loopEnd) {
                    danceVideo.currentTime = loopStart;
                }
            }
        }

        function setLoopEnd() {
            if (!danceVideo.src || danceVideo.src === '') {
                alert('请先上传视频');
                return;
            }
            const currentTime = danceVideo.currentTime;
            loopEnd = currentTime;
            if (loopStart !== null && loopEnd <= loopStart) {
                alert('终点不能小于等于起点，已自动交换');
                [loopStart, loopEnd] = [loopEnd, loopStart];
            }
            updateLoopStatusDisplay();
            if (loopEnabled && loopStart !== null && loopEnd !== null) {
                if (danceVideo.currentTime < loopStart || danceVideo.currentTime > loopEnd) {
                    danceVideo.currentTime = loopStart;
                }
            }
        }

        function clearLoop() {
            loopStart = null;
            loopEnd = null;
            if (loopEnabled) {
                loopEnabled = false;
                toggleLoopBtn.textContent = '⏸ 循环未启用';
                toggleLoopBtn.classList.remove('active');
            }
            updateLoopStatusDisplay();
        }

        function toggleLoop() {
            if (!danceVideo.src || danceVideo.src === '') {
                alert('请先上传视频');
                return;
            }
            if (loopStart === null || loopEnd === null) {
                alert('请先标记循环的起点和终点');
                return;
            }
            loopEnabled = !loopEnabled;
            if (loopEnabled) {
                toggleLoopBtn.textContent = '🔁 循环已启用';
                toggleLoopBtn.classList.add('active');
                if (danceVideo.currentTime < loopStart || danceVideo.currentTime > loopEnd) {
                    danceVideo.currentTime = loopStart;
                }
            } else {
                toggleLoopBtn.textContent = '⏸ 循环未启用';
                toggleLoopBtn.classList.remove('active');
            }
        }

        function handleTimeUpdate() {
            if (!loopEnabled) return;
            if (loopStart === null || loopEnd === null) return;
            if (danceVideo.currentTime >= loopEnd) {
                danceVideo.currentTime = loopStart;
                if (danceVideo.paused) {
                    danceVideo.play().catch(e => console.warn);
                }
            }
            updateProgressUI();
        }

        // 视频元数据加载完成
        function onLoadedMetadata() {
            durationLabel.innerText = formatTime(danceVideo.duration);
            updateProgressUI();
            updateLoopMarkers();
        }

        // 上传视频
        function handleVideoUpload(file) {
            if (currentVideoURL) URL.revokeObjectURL(currentVideoURL);
            const url = URL.createObjectURL(file);
            currentVideoURL = url;
            danceVideo.src = url;
            danceVideo.load();
            fileNameSpan.innerHTML = `🎬 ${file.name}`;
            // 重置所有画面变换
            currentRotate = 0;
            currentScale = 1.0;
            isMirrored = false;
            scaleSlider.value = '1.0';
            updateScale();
            resetRotate();
            setMirror(false);
            // 重置循环
            clearLoop();
            // 速度重置
            speedSlider.value = '1.0';
            updateSpeed();
            // 音量重置（保留默认1.0）
            volumeSlider.value = '1.0';
            updateVolume();
            danceVideo.addEventListener('loadedmetadata', onLoadedMetadata, { once: true });
        }

        // 进度条交互
        function seekTo(e) {
            const rect = progressTrack.getBoundingClientRect();
            let clientX;
            if (e.type === 'mousemove' && isDragging) {
                clientX = e.clientX;
            } else if (e.type === 'click' || e.type === 'mousedown') {
                clientX = e.clientX;
            } else {
                return;
            }
            let x = clientX - rect.left;
            x = Math.max(0, Math.min(x, rect.width));
            const percent = x / rect.width;
            const time = percent * danceVideo.duration;
            danceVideo.currentTime = time;
            updateProgressUI();
        }

        function onMouseMove(e) {
            if (isDragging) {
                seekTo(e);
            }
        }
        function onMouseUp() {
            isDragging = false;
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
        }

        // 事件绑定
        videoUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            handleVideoUpload(file);
        });

        speedSlider.addEventListener('input', updateSpeed);
        volumeSlider.addEventListener('input', updateVolume);
        scaleSlider.addEventListener('input', updateScale);
        rotateLeftBtn.addEventListener('click', rotateLeft);
        rotateRightBtn.addEventListener('click', rotateRight);
        resetRotateBtn.addEventListener('click', resetRotate);
        mirrorBtn.addEventListener('click', () => setMirror(true));
        resetMirrorBtn.addEventListener('click', () => setMirror(false));

        playBtn.addEventListener('click', () => {
            if (!danceVideo.src) {
                alert('请先上传视频');
                return;
            }
            if (danceVideo.paused) {
                danceVideo.play().catch(e => alert('播放失败'));
            } else {
                danceVideo.pause();
            }
        });

        restartBtn.addEventListener('click', () => {
            if (!danceVideo.src) return;
            danceVideo.currentTime = 0;
            danceVideo.playbackRate = parseFloat(speedSlider.value);
            danceVideo.play().catch(e => console.warn);
        });

        setStartBtn.addEventListener('click', setLoopStart);
        setEndBtn.addEventListener('click', setLoopEnd);
        clearLoopBtn.addEventListener('click', clearLoop);
        toggleLoopBtn.addEventListener('click', toggleLoop);

        danceVideo.addEventListener('timeupdate', handleTimeUpdate);
        danceVideo.addEventListener('loadedmetadata', onLoadedMetadata);

        // 进度条事件
        progressTrack.addEventListener('click', seekTo);
        progressThumb.addEventListener('mousedown', (e) => {
            e.stopPropagation();
            isDragging = true;
            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('mouseup', onMouseUp);
        });

        // 初始化
        updateLoopMarkers();
        updateVideoTransform();
    })();
</script>
</body>
</html>
